<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AbsensiPro - Sistem Presensi Lapangan</title>
    <meta name="description" content="Aplikasi absensi hybrid pekerja lapangan berbasis radius GPS, foto selfie live unmirrored, integrasi Google Sheets & Google Drive, serta rekapitulasi data multi-perangkat." />
    <meta property="og:title" content="AbsensiPro - Sistem Presensi Lapangan" />
    <meta property="og:description" content="Aplikasi absensi hybrid pekerja lapangan berbasis radius GPS, foto selfie live unmirrored, integrasi Google Sheets & Google Drive, serta rekapitulasi data multi-perangkat." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      try {
        var theme = localStorage.getItem('abs_theme');
        if (!theme) {
          var s = localStorage.getItem('abs_settings');
          if (s) {
            var p = JSON.parse(s);
            if (p && p.theme) theme = p.theme;
          }
        }
        if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased min-h-screen selection:bg-amber-400 selection:text-slate-950 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
